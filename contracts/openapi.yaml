openapi: 3.1.0
info:
  title: Project CHAOS Operator and Read Model API
  version: 2.3.0
  description: >-
    API contract baseline for a modular ASP.NET Core host. Never expose provider IDs
    or unmoderated chat in public endpoints. Write endpoints require trusted operator.
    Owner-confirmed rules: a K0 viewer account is bound to one nation per season.
    Viewer !join uses verified provider chat identity and auto-provisions K0 account.
    First real platform is YouTube Live after permissions; initial release is SINGLE_OPERATOR.
    12 playable eras precede real provider integration, and monetary ingestion is disabled.
    This is design-only; account identity linking is not an implemented public API.
servers:
  - url: https://chaos.example.invalid
security: []
tags:
  - name: public
  - name: operator
paths:
  /api/v2/public/seasons/{seasonId}/nations:
    get:
      tags: [public]
      summary: Three nation summaries
      parameters: [{name: seasonId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Nation list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NationSummary'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/public/seasons/{seasonId}/nations/{nationId}/snapshot:
    get:
      tags: [public]
      summary: Full public projection for reconnect
      parameters:
        - {name: seasonId, in: path, required: true, schema: {type: string}}
        - {name: nationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Public snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/NationSummary'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/public/seasons/{seasonId}/nations/{nationId}/deltas:
    get:
      tags: [public]
      summary: Replay buffered public deltas or demand full snapshot
      parameters:
        - {name: seasonId, in: path, required: true, schema: {type: string}}
        - {name: nationId, in: path, required: true, schema: {type: string}}
        - {name: afterSequence, in: query, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Buffered public deltas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NationDelta'}}}}}
        '409': {description: Cursor expired; fetch snapshot}
  /api/v2/operator/seasons:
    post:
      tags: [operator]
      summary: Create draft season, no LIVE enabled by default
      security: [{operatorJwt: [owner]}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSeason'}}}}
      responses:
        '201': {description: Draft season created}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/operator/seasons/{seasonId}/bindings:
    put:
      tags: [operator]
      summary: Replace draft bindings with optimistic revision; RUNNING requires safe pause+audit
      security: [{operatorJwt: [owner]}]
      parameters:
        - {name: seasonId, in: path, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Bindings'}}}}
      responses:
        '200': {description: Replaced draft assignment}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/operator/seasons/{seasonId}/actions:
    post:
      tags: [operator]
      summary: Start, pause, resume, emergency-stop, abort and approved scheduled event actions
      security: [{operatorJwt: [operator]}]
      parameters:
        - {name: seasonId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperatorAction'}}}}
      responses:
        '202': {description: Action accepted for authoritative worker}
        '403': {description: Insufficient role}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v2/operator/seasons/{seasonId}/primary-return:
    post:
      tags: [operator]
      summary: Verify same primary broadcaster and resume a departure pause before 7-day UTC deadline
      description: >-
        OWNER-only, serializable and idempotent. Verify same primary K0 account,
        authorized original channel/binding revision and current CHAT_READ/LIVE_PRESENCE.
        Must reach commit strictly before deadline; at equality ABORTED wins.
        Never resume ABORTED or re-open CANCELLED competitions. No retroactive clocks.
        Design-only: endpoint is not deployed.
      security: [{operatorJwt: [owner]}]
      parameters:
        - {name: seasonId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 12}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrimaryBroadcasterReturn'}
      responses:
        '202': {description: Verified return command accepted idempotently; authoritative worker performs fenced commit}
        '400': {description: Invalid account, insufficient capability evidence or inconsistent binding revision}
        '403': {description: OWNER approval or scope missing}
        '409': {description: Active incident missing, deadline elapsed or season already ABORTED}
  /health/live:
    get:
      responses: {'200': {description: Host responsive}}
  /health/ready:
    get:
      responses: {'200': {description: Database, outbox and writer healthy}, '503': {description: Not ready}}
components:
  securitySchemes:
    operatorJwt:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/oauth2/authorize
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes: {owner: 'Manage bindings and monetization policies', operator: 'Operate sessions and approved events', auditor: 'Read audit'}
  schemas:
    NationSummary:
      type: object
      required: [schemaVersion, seasonId, nationId, factionId, eraIndex, historicalPoints, liveState]
      properties:
        schemaVersion: {const: '2.3.0'}
        seasonId: {type: string}
        nationId: {type: string, format: uuid}
        factionId: {type: string, enum: [micelios,runicos,ferrinos]}
        eraIndex: {type: integer, minimum: 1, maximum: 13}
        historicalPoints: {type: integer, minimum: 0, maximum: 100}
        liveState: {type: string, enum: [LIVE_CONFIRMED,OFFLINE_CONFIRMED,UNCERTAIN]}
    NationDelta:
      type: object
      required: [schemaVersion, seasonId, nationId, factionId, sequence, serverUtc, stateHash, eraIndex, historicalPoints, liveState, resources, buildingChanges, activeCitizenCount]
      properties:
        schemaVersion: {const: '2.3.0'}
        seasonId: {type: string, format: uuid}
        nationId: {type: string, format: uuid}
        factionId: {type: string, enum: [micelios,runicos,ferrinos]}
        sequence: {type: integer, minimum: 0}
        serverUtc: {type: string, format: date-time}
        stateHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        eraIndex: {type: integer, minimum: 1, maximum: 13}
        historicalPoints: {type: integer, minimum: 0, maximum: 100}
        liveState: {type: string, enum: [LIVE_CONFIRMED,OFFLINE_CONFIRMED,UNCERTAIN]}
        resources: {type: object, additionalProperties: {type: integer, minimum: 0}}
        buildingChanges:
          type: array
          items:
            type: object
            required: [buildingId, state]
            properties:
              buildingId: {type: string, minLength: 1}
              state: {type: string, enum: [QUEUED,BUILDING,COMPLETED,CANCELLED]}
              completionBp: {type: integer, minimum: 0, maximum: 10000}
        activeCitizenCount: {type: integer, minimum: 0}
        eventCue: {type: string}
    CreateSeason:
      type: object
      required: [campaignId, rulesetHash, contentHash, seed, broadcastMode]
      properties:
        campaignId: {type: string, format: uuid}
        broadcastMode: {type: string, enum: [SINGLE_OPERATOR,MULTI_STREAMER]}
        rulesetHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        seed: {type: string, pattern: '^[a-f0-9]{64}$'}
    Bindings:
      type: object
      required: [assignments]
      properties:
        assignments: {type: array, minItems: 3, maxItems: 3, items: {type: object}}
    PrimaryBroadcasterReturn:
      type: object
      additionalProperties: false
      required: [schemaVersion, incidentId, primaryAccountId, nationId, bindingId, bindingRevision, ownerReason]
      properties:
        schemaVersion: {const: '2.4.0'}
        incidentId: {type: string, format: uuid}
        primaryAccountId: {type: string, format: uuid}
        nationId: {type: string, format: uuid}
        bindingId: {type: string, format: uuid}
        bindingRevision: {type: integer, minimum: 1}
        ownerReason: {type: string, minLength: 3}
    OperatorAction:
      description: General operational commands; RESUME cannot override an active primary departure pause or terminal ABORTED state.
      type: object
      required: [kind, reason]
      properties:
        kind: {type: string, enum: [START,PAUSE,RESUME,EMERGENCY_STOP,ABORT,SCHEDULE_TOURNAMENT,SCHEDULE_EVENT]}
        reason: {type: string, minLength: 3}
  responses:
    NotFound:
      description: Unknown season or nation
    Conflict:
      description: Invalid state transition or version conflict
