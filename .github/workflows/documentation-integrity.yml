name: Documentation integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned validators
        run: python -m pip install -r tools/requirements-validation.txt
      - name: Compile validation code
        run: python -m compileall -q tools
      - name: Validate documentation, contracts and manifest
        run: python tools/validate_repo.py
