name: Project CHAOS documentation and contracts

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'contracts/**'
      - 'architecture/**'
      - 'docs/**'
      - 'audit/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'contracts/**'
      - 'architecture/**'
      - 'docs/**'
      - 'audit/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check normative specification and forbidden duplicates
        run: python3 tools/check_active_spec.py --check
      - name: Validate structured game catalogs and contracts
        run: python3 tools/validate_design_catalogs.py
      - name: Validate Markdown links and canonical document list
        run: python3 tools/validate_documentation.py
