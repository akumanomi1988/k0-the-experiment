name: K0 canonical documentation and design integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify single canonical Markdown documentation and all local links
        run: python3 tools/validate_documentation.py
      - name: Verify structured catalogs, IDs, rules and design contracts
        run: python3 tools/validate_design_catalogs.py
